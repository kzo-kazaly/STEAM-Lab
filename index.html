<!DOCTYPE html>
<html lang="kk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Phonics STEAM Lab</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;800;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#eaf4fb;--grid:#cfe3f1;--ink:#14213d;--card:#fff;--blue:#2f5bea;--lime:#7bd88f;--sun:#ffd23f;--coral:#ff6b6b;--mute:#5b6b8c;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1a30;--grid:#1a2a4a;--ink:#f1f5ff;--card:#1b2a49;--mute:#a9b8d8}}
:root[data-theme="dark"]{--bg:#0f1a30;--grid:#1a2a4a;--ink:#f1f5ff;--card:#1b2a49;--mute:#a9b8d8}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--ink);font-family:Nunito,"Segoe UI",system-ui,sans-serif;font-weight:600;
background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:28px 28px}
#app{max-width:760px;margin:0 auto;padding:16px}
h1,h2,h3{margin:0;font-weight:900}
.top{display:flex;align-items:center;gap:10px;justify-content:space-between;margin-bottom:14px}
.logo{font-size:1.25rem;font-weight:900}.stars{background:var(--sun);color:#14213d;border-radius:20px;padding:4px 12px;font-weight:900}
button{font:inherit;font-weight:800;cursor:pointer;border:0;border-radius:14px;padding:12px 18px;background:var(--blue);color:#fff;min-height:46px}
button.ghost{background:var(--card);color:var(--ink);border:2px solid var(--ink)}
button:focus-visible,input:focus-visible{outline:4px solid var(--coral);outline-offset:2px}
.card{background:var(--card);border:2px solid var(--ink);border-radius:18px;padding:16px;margin-bottom:14px}
.hero{display:flex;gap:14px;align-items:center}.bot{font-size:4rem;line-height:1}
input{font:inherit;padding:12px;border-radius:12px;border:2px solid var(--ink);background:var(--card);color:var(--ink);width:100%;margin:8px 0}
.map{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.isl{text-align:left;background:var(--card);color:var(--ink);border:2px solid var(--ink);border-radius:26px 26px 26px 6px;padding:14px;min-height:130px}
.isl.lock{opacity:.5}.isl b{font-size:1.15rem;display:block}.isl small{color:var(--mute);font-weight:700}
.let{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}.let span{background:var(--sun);color:#14213d;border-radius:8px;padding:2px 9px;font-weight:900}
.steps{display:grid;gap:10px}.step{display:flex;justify-content:space-between;align-items:center;gap:10px}
.done{background:var(--lime);color:#14213d}
.tiles{display:flex;flex-wrap:wrap;gap:12px;justify-content:center}
.tile{width:92px;height:92px;font-size:2.8rem;font-weight:900;background:var(--card);color:var(--ink);border:3px solid var(--ink);border-radius:20px;padding:0}
.tile.on{background:var(--sun);color:#14213d}.tile.old{border-style:dashed;opacity:.75}
.big{font-size:5rem;text-align:center;line-height:1.1}
.slots,.pool{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:14px 0}
.slot{width:64px;height:72px;border:3px dashed var(--ink);border-radius:14px;display:grid;place-items:center;font-size:2.2rem;font-weight:900}
.slot.f{border-style:solid;background:var(--lime);color:#14213d}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:12px}.opts button{font-size:3.4rem;background:var(--card);border:3px solid var(--ink);padding:14px}
.shake{animation:sh .35s}@keyframes sh{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.msg{text-align:center;font-weight:900;min-height:1.6em}.sub{color:var(--mute);margin:4px 0 10px}
.w{display:inline-block;margin:0 2px;padding:2px 4px;border-radius:8px;transition:background .2s}.w.hi{background:var(--sun);color:#14213d}
.wl{display:flex;flex-wrap:wrap;gap:10px}.wl button{background:var(--card);color:var(--ink);border:2px solid var(--ink);font-size:1.6rem}
.badge{font-size:3rem;text-align:center}
@media (prefers-reduced-motion:reduce){.shake{animation:none}}
.wl button.done{background:var(--lime);color:#14213d}
#app{padding-bottom:150px}
#mic{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--card);color:var(--ink);border-top:3px solid var(--ink);padding:8px 12px calc(8px + env(safe-area-inset-bottom,0px));display:none}
#mic .mrow{display:flex;gap:8px;align-items:center;justify-content:center;flex-wrap:wrap;margin:3px 0}
#mic button{min-height:40px;padding:8px 12px}#mic .mb{display:inline-flex;align-items:center;min-height:40px;padding:8px 12px;border-radius:999px;background:var(--navy);color:#fff;font-weight:800;cursor:pointer}
#mic .mic{width:54px;height:54px;padding:0;font-size:1.5rem;border-radius:50%;background:var(--blue);flex:0 0 auto}
#mic button.rec{animation:mp 1s infinite;background:var(--coral);color:#14213d}
:root{--bg:#dbe6f8;--frame:#e9f0fc;--card:#fff;--ink:#12234d;--mute:#667799;--navy:#0d2a63;--blue:#2f6bff;--line:#d3def5;--sun:#ffd23f}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0a1530;--frame:#0f1d3d;--card:#16294f;--ink:#eaf0ff;--mute:#9db0d6;--navy:#1d3f8c;--line:#2a4380}}
:root[data-theme="dark"]{--bg:#0a1530;--frame:#0f1d3d;--card:#16294f;--ink:#eaf0ff;--mute:#9db0d6;--navy:#1d3f8c;--line:#2a4380}
body{background:var(--bg);background-image:none}
#app{max-width:1020px;margin:14px auto;padding:20px 20px 150px;background:var(--frame);border-radius:30px;box-shadow:0 8px 30px rgba(20,50,120,.12)}
.card{border:0;border-radius:20px;box-shadow:0 2px 10px rgba(30,60,140,.07)}
button{background:var(--navy);border-radius:999px}
button.ghost{background:var(--card);color:var(--ink);border:2px solid var(--line)}
.bar{display:flex;align-items:center;gap:12px;margin-bottom:16px;flex-wrap:wrap}.brand{display:flex;align-items:center;gap:8px;font-weight:900}.brand b{font-size:1.05rem}
.lg{display:grid;place-items:center;width:38px;height:38px;border-radius:12px;background:var(--navy);font-size:1.3rem}
.srch{flex:1;min-width:150px;margin:0;border:0;border-radius:999px;background:var(--card);padding:11px 16px;font-weight:600}
.br{display:flex;align-items:center;gap:10px}.avc{display:grid;place-items:center;width:38px;height:38px;border-radius:50%;background:var(--card);font-size:1.4rem}
.hi{margin:6px 2px 14px}.sec{margin:20px 2px 10px}
.cols{display:grid;grid-template-columns:1fr 250px;gap:16px;align-items:start}
.top3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.hero3{background:var(--navy);color:#fff;border-radius:22px;padding:16px;position:relative;overflow:hidden;min-height:160px}
.hero3 h3,.hero3 h2{color:#fff}.hero3 p{font-size:.85rem;opacity:.85;margin:6px 0 14px;max-width:70%}.hero3 i{position:absolute;right:8px;bottom:4px;font-size:4.2rem;font-style:normal;opacity:.9}
.wbtn{background:#fff;color:#0d2a63;padding:8px 16px;min-height:38px;position:relative;z-index:1}
.chips{display:flex;gap:10px;overflow-x:auto;padding-bottom:4px}
.chip{display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--card);color:var(--ink);border-radius:16px;padding:10px 14px;font-weight:800;white-space:nowrap;text-align:left}
.ic{display:grid;place-items:center;width:30px;height:30px;border-radius:50%;background:var(--blue);font-size:.85rem}
.two{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:14px}.two .card{margin:0}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;text-align:center}.cal b{font-size:.7rem;color:var(--mute)}
.cal span{position:relative;height:30px;display:grid;place-items:center;border-radius:9px;font-size:.85rem}
.cal .td{background:var(--blue);color:#fff;font-weight:900}.cal .pl::after{content:"";position:absolute;bottom:2px;width:5px;height:5px;border-radius:50%;background:var(--sun)}
.pb{height:10px;border-radius:6px;background:var(--line);overflow:hidden}.pb i{display:block;height:100%;background:var(--blue);border-radius:6px}
.pill{background:var(--navy);color:#fff;border-radius:999px;padding:6px 12px;font-weight:800;font-size:.85rem}
.gp{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px}.gp .chip{background:var(--frame)}
.cont{margin:0}.art{background:var(--line);border-radius:16px;height:110px;display:grid;place-items:center;font-size:3.6rem}
@media (max-width:820px){.cols,.two,.top3{grid-template-columns:1fr}.cont{order:-1}#app{margin:0;border-radius:0;padding:14px 14px 150px}}
@keyframes mp{50%{box-shadow:0 0 0 10px rgba(255,107,107,.35)}}@media (prefers-reduced-motion:reduce){#mic button.rec{animation:none}}
</style>
</head>

var AP={};function snd(c){try{speechSynthesis.cancel()}catch(e){}if(AUD[c]){try{var a=AP[c]||(AP[c]=new Audio("data:audio/mpeg;base64,"+AUD[c]));a.currentTime=0;var pr=a.play();if(pr&&pr.catch)pr.catch(function(){say(SND[c]||c,.7)});return}catch(e){}}say(SND[c]||c,.7)}
function steps(n){return st.prog[n]||[]}
function has(n,s){return steps(n).indexOf(s)>-1}
function fin(n,s){if(!has(n,s)){st.prog[n]=steps(n).concat(s);st.stars+=3;if(st.prog[n].length>=5&&st.badges.indexOf(n)<0)st.badges.push(n)}save()}
function open_(n){return n==1||st.unlockAll||st.badges.indexOf(n-1)>-1}
function hdr(back){return '<div class="top"><div>'+(back?'<button class="ghost" onclick="'+back+'">← Артқа</button>':'<span class="logo">🤖 Phonics STEAM Lab</span>')+'</div><span class="stars">⭐ '+st.stars+'</span></div>'}
function home(){
 if(!st.name){app.innerHTML=hdr()+'<div class="card hero"><div class="bot">🤖🐱</div><div><h2>Сәлем! Мен Робо-Мысық.</h2><p class="sub">Әріптерден сөз құрауға көмектесемін. Атың кім?</p></div></div><div class="card"><input id="nm" placeholder="Атыңды жаз" maxlength="20" aria-label="Аты"><button onclick="setName()">Бастау</button></div>';return}
 var h=hdr()+'<div class="card hero"><div class="bot">🤖🐱</div><div><h2>Сәлем, '+esc(st.name)+'!</h2><p class="sub">Арал таңдап, әріптерді үйрен.</p></div></div><div class="map">';
 G.forEach(function(g){var o=open_(g.n),d=steps(g.n).length,b=st.badges.indexOf(g.n)>-1;
  h+='<button class="isl'+(o?'':' lock')+'" '+(o?'onclick="grp('+g.n+')"':'disabled')+'><b>'+(o?'':'🔒 ')+g.n+'-топ: '+g.name+(b?' 🏅':'')+'</b><small>'+d+' / 5 қадам</small><div class="let">'+g.nw.map(function(c){return'<span>'+c+'</span>'}).join('')+'</div></button>'});
 h+='</div><p class="sub" style="text-align:center"><button class="ghost" onclick="st.unlockAll=true;save();home()">Мұғалім: барлық аралды ашу</button></p>';
 app.innerHTML=h}
function esc(s){return s.replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function setName(){var v=document.getElementById("nm").value.trim();if(!v)return;st.name=v;save();home()}
function grp(n){var g=G[n-1],L=[["learn","🔊 Әріптерді тыңда"],["blend","🔤 Қосып оқы"],["build","🧩 Сөз құрастыр"],["pick","👂 Тыңда да тап"],["steam","🔬 STEAM тапсырма"]];
 var h=hdr("home()")+'<div class="card"><h2>'+n+'-топ: '+g.name+'</h2><div class="let">'+g.known.map(function(c){return'<span>'+c+'</span>'}).join('')+'</div></div><div class="steps">';
 L.forEach(function(x){h+='<div class="card step"><b>'+x[1]+'</b><button class="'+(has(n,x[0])?'done':'')+'" onclick="'+x[0]+'('+n+')">'+(has(n,x[0])?'✓ Қайталау':'Бастау')+'</button></div>'});
 if(st.badges.indexOf(n)>-1)h+='<div class="card badge">🏅<br>«Жас зерттеуші» төсбелгісі!</div>';
 app.innerHTML=h+'</div>'}
function learn(n){var g=G[n-1];T={n:n,t:{}};
 var h=hdr("grp("+n+")")+'<div class="card"><h2>Әріпті бас — дыбысын тыңда</h2><p class="sub">Сары әріптер — жаңа. Үзік жиекті — бұрын өткендер.</p><div class="tiles">';
 g.known.forEach(function(c){var nw=g.nw.indexOf(c)>-1;h+='<button class="tile'+(nw?'':' old')+'" id="t_'+c+'" onclick="tap_(\''+c+'\')">'+c+'</button>'});
 app.innerHTML=h+'</div><p class="msg" id="m"></p></div>'}
function tap_(c){snd(c);T.t[c]=1;var g=G[T.n-1];document.getElementById("t_"+c).classList.add("on");
 if(g.nw.every(function(x){return T.t[x]})){fin(T.n,"learn");document.getElementById("m").textContent="⭐ Керемет! Барлық жаңа әріпті естідің."}}
function blend(n){var g=G[n-1];T={n:n,c:0};
 var h=hdr("grp("+n+")")+'<div class="card"><h2>Әріптерді қос да оқы</h2><p class="sub">Сөзді бас: әріптер бірінен кейін бірі жанады. 3 сөзді оқы.</p><div class="wl">';
 g.w.forEach(function(x,i){h+='<button onclick="bl('+i+')">'+x[1]+' '+x[0]+'</button>'});
 app.innerHTML=h+'</div></div><div class="card"><div class="big" id="bw">&nbsp;</div><p class="msg" id="m"></p></div>'}
function bl(i){var x=G[T.n-1].w[i],w=x[0],bw=document.getElementById("bw");
 bw.innerHTML=w.split("").map(function(c,k){return'<span class="w" id="b'+k+'">'+c+'</span>'}).join("");
 w.split("").forEach(function(c,k){setTimeout(function(){var e=document.getElementById("b"+k);if(e){e.classList.add("hi");snd(c)}},k*750)});
 setTimeout(function(){say(w,.7);var m=document.getElementById("m");if(m)m.textContent=x[1]+" "+w+" — "+x[2];T.c++;if(T.c>=3){fin(T.n,"blend")}},w.length*750+200)}
function build(n){T={n:n,r:0,q:sh(G[n-1].w).slice(0,5)};br()}
function br(){var n=T.n;if(T.r>=T.q.length){fin(n,"build");app.innerHTML=hdr("grp("+n+")")+'<div class="card badge">🎉<br>Бәрін құрастырдың!</div>';return}
 var x=T.q[T.r];T.i=0;T.w=x[0];
 var h=hdr("grp("+n+")")+'<div class="card"><p class="sub">'+(T.r+1)+' / '+T.q.length+'</p><div class="big">'+x[1]+'</div><div class="slots">';
 x[0].split("").forEach(function(c,k){h+='<div class="slot" id="s'+k+'"></div>'});
 h+='</div><div class="pool">';
 sh(x[0].split("")).forEach(function(c,k){h+='<button class="tile" id="p'+k+'" data-c="'+c+'" onclick="pk(this)">'+c+'</button>'});
 app.innerHTML=h+'</div><p class="msg" id="m"></p></div>';say(x[0],.7)}
function pk(b){var c=b.getAttribute("data-c");
 if(c==T.w[T.i]){snd(c);var s=document.getElementById("s"+T.i);s.textContent=c;s.classList.add("f");b.disabled=true;b.style.opacity=.3;T.i++;
  if(T.i>=T.w.length){say(T.w+". "+cheer(),.75);document.getElementById("m").textContent="⭐ "+T.w+" — "+"Well done!";st.stars++;save();setTimeout(function(){T.r++;br()},2600)}}
 else{b.classList.remove("shake");void b.offsetWidth;b.classList.add("shake");document.getElementById("m").textContent="Тағы тыңдап көр"}}
function pick(n){T={n:n,r:0,ok:0,q:sh(G[n-1].w).slice(0,6)};pr()}
function pr(){var n=T.n;if(T.r>=T.q.length){app.innerHTML=hdr("grp("+n+")")+'<div class="card badge">🎉<br>'+T.ok+' / '+T.q.length+' дұрыс!</div>';if(T.ok>=4)fin(n,"pick");return}
 var x=T.q[T.r],all=G[n-1].w.filter(function(y){return y[0]!=x[0]}),o=sh(sh(all).slice(0,3).concat([x]));T.a=x[0];T.f=false;
 var h=hdr("grp("+n+")")+'<div class="card"><p class="sub">'+(T.r+1)+' / '+T.q.length+'</p><div style="text-align:center"><button onclick="say(T.a,.7)">🔊 Тыңдау</button></div><div class="opts" style="margin-top:14px">';
 o.forEach(function(y){h+='<button onclick="ch(this,\''+y[0]+'\')">'+y[1]+'</button>'});

 G.forEach(function(g){var o=open_(g.n),d=REQ(g.n).filter(function(k){return has(g.n,k)}).length,b=st.badges.indexOf(g.n)>-1;

function srch(v){var r=document.getElementById("sr");if(!r)return;v=v.trim().toLowerCase();if(!v){r.innerHTML="";return}var a={};ST.join(" ").split(" ").concat(HD.join(" ").split(" ")).forEach(function(w){a[w]=1});

function cal(){var d=new Date(),y=d.getFullYear(),m=d.getMonth(),off=(new Date(y,m,1).getDay()+6)%7,len=new Date(y,m+1,0).getDate(),dy=st.days||[],MN=["Қаңтар","Ақпан","Наурыз","Сәуір","Мамыр","Маусым","Шілде","Тамыз","Қыркүйек","Қазан","Қараша","Желтоқсан"],
 h='<h3>'+MN[m]+' '+y+'</h3><p class="sub" style="margin:2px 0 8px">Нүкте — оқыған күндерің</p><div class="cal">'+["Дс","Сс","Ср","Бс","Жм","Сб","Жс"].map(function(x){return'<b>'+x+'</b>'}).join("");
 for(var i=0;i<off;i++)h+='<span></span>';for(i=1;i<=len;i++)h+='<span class="'+(i==d.getDate()?"td ":"")+(dy.indexOf(y+"-"+("0"+(m+1)).slice(-2)+"-"+("0"+i).slice(-2))>-1?"pl":"")+'">'+i+'</span>';return h+'</div>'}
var IC={learn:"🔊",blend:"🔤",build:"🧩",pick:"👂",words:"📚",steam:"🔬",shadow:"🌑",colors:"🌈",quiz:"⏱"};
function home(){var av=st.av||"🐱";
 if(!st.name){app.innerHTML=hdr()+'<div class="hero3" style="display:flex;gap:14px;align-items:center;margin-bottom:14px"><div style="font-size:3.6rem">🤖'+av+'</div><div><h2>Сәлем! Мен Робо-Мысықпын.</h2><p style="margin:4px 0 0;opacity:.85">Аватарыңды таңда да, атыңды жаз.</p></div></div><div class="card"><div class="tiles">'+AVS.map(function(a){return'<button class="tile" style="font-size:2rem;width:64px;height:64px" onclick="st.av=\''+a+'\';home()">'+a+'</button>'}).join("")+'</div><input id="nm" placeholder="Атыңды жаз" maxlength="20" aria-label="Аты"><button onclick="setName()">Бастау</button></div>';return}
 var n=nxt(),tot=0,dn=0,gm=steps("H").length;G.forEach(function(g){REQ(g.n).forEach(function(k){tot++;if(has(g.n,k))dn++})});var pc=Math.round(dn/tot*100),gp=Math.round(gm/9*100),cg=G[n[0]-1];
 var h=hdr()+'<h2 class="hi">Сәлем, '+esc(st.name)+' 👋</h2><div class="cols"><div><div class="top3">'+
 '<div class="hero3"><h3>Әріп аралдары</h3><p>4 топ: әріптен сөзге дейін</p><button class="wbtn" onclick="grp('+n[0]+')">Бастау ›</button><i>🏝️</i></div>'+
 '<div class="hero3"><h3>STEAM Lab</h3><p>9 мини-ойын: ғылым, техника, өнер</p><button class="wbtn" onclick="hub()">Ойнау ›</button><i>🔬</i></div>'+
 '<div class="hero3"><h3>Тәжірибе</h3><p>Дыбыстарды қосып оқу, мағына тапсырмасы</p><button class="wbtn" onclick="prac()">Бастау ›</button><i>✏️</i></div></div>'+
 '<h3 class="sec">Тағы не істей аласың</h3><div class="chips">'+
 [["🔊","Әріптер","FN.learn("+n[0]+")"],["📚","Сөздер","FN.words("+n[0]+")"],["🎮","Ойындар","hub()"],["✏️","Тәжірибе","prac()"],["🔓","Мұғалім: бәрін ашу","st.unlockAll=true;save();home()"]].map(function(x){return'<button class="chip" onclick="'+x[2]+'"><span>'+x[1]+'</span><span class="ic">'+x[0]+'</span></button>'}).join("")+'</div>'+
 '<div class="two"><div class="card">'+cal()+'</div><div class="card"><div style="display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap"><h3>Phonics жол картасы</h3><span class="pill">🏅 '+st.badges.length+' / 4</span></div>'+
 '<p class="sub" style="margin:10px 0 4px">Аяқталған қадамдар: '+dn+'/'+tot+'</p><div class="pb"><i style="width:'+pc+'%"></i></div><p class="sub" style="margin:10px 0 4px">STEAM ойындары: '+gm+'/9</p><div class="pb"><i style="width:'+gp+'%"></i></div>'+
 '<div class="gp">'+G.map(function(g){var o=open_(g.n),d=REQ(g.n).filter(function(k){return has(g.n,k)}).length;return'<button class="chip" '+(o?'onclick="grp('+g.n+')"':'disabled style="opacity:.5"')+'><span>'+(o?'':'🔒 ')+g.n+'-топ<small style="display:block;color:var(--mute)">'+d+' / '+REQ(g.n).length+'</small></span></button>'}).join("")+'</div></div></div></div>'+
 '<div class="card cont"><h3>Осы жерден жалғастыр</h3><div class="art">'+(n[1]?IC[n[1]]:"🏆")+'</div><div style="display:flex;gap:10px;align-items:center;margin:10px 0"><svg width="42" height="42" viewBox="0 0 36 36"><circle cx="18" cy="18" r="15" fill="none" style="stroke:var(--line)" stroke-width="4"/><circle cx="18" cy="18" r="15" fill="none" style="stroke:var(--blue)" stroke-width="4" stroke-linecap="round" stroke-dasharray="94.2" stroke-dashoffset="'+(94.2*(1-pc/100)).toFixed(1)+'" transform="rotate(-90 18 18)"/></svg><div><b>'+pc+'%</b><div class="sub" style="margin:0">'+n[0]+'-топ · '+cg.name+'</div></div></div><p style="margin:4px 0 10px;font-weight:800">'+(n[1]?LB[n[1]]:"Барлық қадам аяқталды!")+'</p><button class="ghost" onclick="'+(n[1]?"FN['"+n[1]+"']("+n[0]+")":"hub()")+'">Жалғастыру ›</button></div></div>';
 app.innerHTML=h}

/* ===== Микрофон: оқушы өзін тыңдап тексереді ===== */
var MT=null,MS="idle",ME="",MA=null,REC=null,MTM=null;
var MERR={policy:"Микрофон бұл бетте бұғатталған.",nosupport:"Бұл браузер дыбыс жазуды қолдамайды.",denied:"Микрофонға рұқсат жоқ. Браузер баптауынан рұқсат бер.",nomic:"Микрофон табылмады."};
function setMT(t,v){if(!t)MT=null;else{if(!MT||MT.t!=t||MT.v!=v){MA=null;MS="idle";ME=""}MT={t:t,v:v}}micUI()}
function micMsg(m){var e=document.getElementById("mm");if(e)e.textContent=m}
function micDiag(){try{var pp=document.permissionsPolicy||document.featurePolicy;if(pp&&pp.allowsFeature&&!pp.allowsFeature("microphone"))return"policy"}catch(e){}
 if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia||!window.MediaRecorder)return"nosupport";return""}
function micUI(){var b=document.getElementById("mic");if(!b)return;if(!MT){b.style.display="none";return}b.style.display="block";
 var m=MS=="rec"?"🔴 Жазылып жатыр… айт! (қайта бассаң, тоқтайды)":MS=="ask"?"Браузердің сұрағына «Рұқсат ету» бас…":MS=="err"?(MERR[ME]||ME):MA?"Өзіңді тыңда да, үлгімен салыстыр:":"Үлгіні тыңда, сосын 🎤 басып айт.";
 b.innerHTML='<div class="mrow"><span>🎯 <b>'+esc(MT.v)+'</b></span><button onclick="mref()" aria-label="Үлгі">🔊</button><button class="mic'+(MS=="rec"?" rec":"")+'" onclick="mrec()" aria-label="Жазу">'+(MS=="rec"?"⏹":"🎤")+'</button>'+(MA?'<button onclick="mme()" aria-label="Менің дауысым">▶ Мен</button><button onclick="mcmp()">⚖</button>':'')+'</div><div class="mrow"><span id="mm" class="sub" style="margin:0">'+m+'</span>'+(MA&&MS!="err"?'<button class="done" onclick="mok(1)">😊 Дұрыс</button><button class="ghost" onclick="mok(0)">🔁 Қайта</button>':'')+'</div>'}
function mref(){try{speechSynthesis.cancel()}catch(e){}if(MT)MT.t=="l"?snd(MT.v):say(MT.v,.7)}
function mme(){if(MA){try{speechSynthesis.cancel()}catch(e){}MA.currentTime=0;var p=MA.play();if(p&&p.catch)p.catch(function(){micMsg("Жазба ойнатылмады, қайта жазып көр.")})}}
function mcmp(){if(!MT||!MA)return;if(MT.t=="l"){snd(MT.v);setTimeout(mme,900);return}
 try{speechSynthesis.cancel();var u=new SpeechSynthesisUtterance(MT.v),d=0,f=function(){if(!d){d=1;mme()}};u.lang="en-GB";if(VOICE)u.voice=VOICE;u.rate=.7;u.pitch=1.2;u.onend=f;speechSynthesis.speak(u);setTimeout(f,3500)}catch(e){mme()}}
function mrec(){if(REC&&REC.state=="recording"){REC.stop();return}try{speechSynthesis.cancel()}catch(e){}
 var d=micDiag();if(d){MS="err";ME=d;micUI();return}
 MS="ask";ME="";micUI();
 navigator.mediaDevices.getUserMedia({audio:true}).then(function(s){var ch=[],mt=["audio/webm;codecs=opus","audio/webm","audio/mp4","audio/ogg"].filter(function(t){return MediaRecorder.isTypeSupported&&MediaRecorder.isTypeSupported(t)})[0];
  REC=mt?new MediaRecorder(s,{mimeType:mt}):new MediaRecorder(s);REC.ondataavailable=function(e){if(e.data&&e.data.size)ch.push(e.data)};
  REC.onstop=function(){clearTimeout(MTM);s.getTracks().forEach(function(t){t.stop()});MS="idle";
   if(ch.length){MA=new Audio(URL.createObjectURL(new Blob(ch,{type:REC.mimeType||mt||"audio/webm"})))}else{MS="err";ME="Дыбыс жазылмады, қайта көр."}micUI()};
  REC.start();MS="rec";micUI();MTM=setTimeout(function(){if(REC&&REC.state=="recording")REC.stop()},6000)})
 .catch(function(e){MS="err";var n=e&&e.name;ME=n=="NotFoundError"?"nomic":(n=="NotAllowedError"||n=="SecurityError")?"denied":(n||"Қате")+(e&&e.message?": "+e.message:"");micUI()})}
function mok(ok){if(ok){st.stars++;st.mic=(st.mic||0)+1;save();micUI();micMsg("⭐ Жарайсың! Өзіңді өзің тексердің.")}else{MA=null;MS="idle";micUI()}}
/* мақсатты сөзді қосу (әр бөлімде) */
var _home=home,_grp=grp,_hub=hub,_prac=prac;
home=function(){setMT(null);_home()};grp=function(n){setMT(null);_grp(n)};hub=function(){setMT(null);_hub()};prac=function(){setMT(null);_prac()};
var _tap=tap_,_bl=bl,_br=br,_pr=pr,_ws=ws,_ww=ww,_st=steam,_p1=p1;
tap_=function(c){setMT("l",c);_tap(c)};
bl=function(i){setMT("w",G[T.n-1].w[i][0]);_bl(i)};
br=function(){_br();if(T&&T.q&&T.r<T.q.length&&T.w)setMT("w",T.w)};
pr=function(){_pr();if(T&&T.a)setMT("w",T.a)};
ww=function(b,w){setMT("w",w);_ww(b,w)};ws=function(i){setMT("w",TX[T.n-1][i][0]);_ws(i)};
steam=function(n){setMT("w",G[n-1].w[0][0]);_st(n)};FN.steam=steam;
p1=function(i){setMT("w",PR1[i][0]);_p1(i)};

home();
</script>
